services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: misconfig
      POSTGRES_PASSWORD: misconfig
      POSTGRES_DB: misconfig
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misconfig"]
      interval: 5s
      timeout: 3s
      retries: 10
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongodata:/data/db"]
volumes:
  pgdata:
  mongodata:
